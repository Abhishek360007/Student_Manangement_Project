spring.application.name=student-management

# Database (in-memory H2, recreated on every start)
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# API credentials (HTTP Basic) - override with APP_USERNAME / APP_PASSWORD
spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:admin123}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Server - cloud hosts (Render, Railway, Heroku...) inject PORT
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Health check for the hosting platform
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
